task:
  tuning_seed_start: 13000
  tuning_seed_count: 64
  seed_start: 13000
  seed_count: 64
  relevant_count: 8
  relevant_count_mode: fixed_exact
  distractor_ratios: [1, 3, 7, 15]
  budgets: [8, 16, 32, 128]
  p_cues: [0.5, 0.65, 0.8, 0.95]
  cue_model: symmetric_label_accuracy
  # cue_model=symmetric_label_accuracy means:
  # P(cue=1 | relevant) = p_cue
  # P(cue=1 | distractor) = 1 - p_cue
  key_space: 4096
  value_space: 16

protocol:
  frozen_evaluation_grid: true
  primary_distractor_ratio: 15
  primary_budget: 8
  primary_p_cue: 0.5
  threshold_candidates: [0.0, 0.5, 1.1]
  min_oracle_recall: 0.9
  min_oracle_fifo_gap: 0.3
