name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Compile
        run: python -m compileall -q embryo scripts tests examples
      - name: Unit Tests
        run: python -m unittest discover -s tests
      - name: Fixture Pipeline
        run: python scripts/run_supervised_memory_pipeline.py --config configs/pipelines/fixture_supervised_memory.yaml --out /tmp/embryo_ci_pipeline
      - name: Release Readiness
        run: python scripts/check_release.py
